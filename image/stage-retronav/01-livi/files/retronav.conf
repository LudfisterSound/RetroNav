# RetroNav first-boot settings. Edit on the SD card's boot partition before
# the first power-up. Read once, on first boot.

# yes = an Apple MFi coprocessor is wired to the Pi's I2C pins (native CarPlay).
# no  = MFi comes from a LIVI Link dongle over USB, or you only need Android Auto.
MFI=no

# yes = show LIVI's boot splash instead of kernel text.
SPLASH=yes
